<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080b18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Document icon -->
  <rect x="30" y="40" width="100" height="130" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="45" y1="70" x2="115" y2="70" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
  <line x1="45" y1="85" x2="115" y2="85" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
  <line x1="45" y1="100" x2="90" y2="100" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
  <text x="80" y="58" text-anchor="middle" fill="#a5b4fc" font-size="9" font-family="monospace">PDF / TXT</text>
  <!-- Arrow -->
  <line x1="140" y1="105" x2="180" y2="105" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="180,100 190,105 180,110" fill="#7c3aed"/>
  <!-- Vector DB -->
  <ellipse cx="230" cy="90" rx="30" ry="10" fill="#2d1b69" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="200" y="90" width="60" height="30" fill="#2d1b69" stroke="#7c3aed" stroke-width="1.5" stroke-top="none"/>
  <ellipse cx="230" cy="120" rx="30" ry="10" fill="#2d1b69" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="230" y="108" text-anchor="middle" fill="#a855f7" font-size="8" font-family="monospace">FAISS</text>
  <!-- Arrow to LLM -->
  <line x1="265" y1="105" x2="305" y2="105" stroke="#06b6d4" stroke-width="2"/>
  <polygon points="305,100 315,105 305,110" fill="#06b6d4"/>
  <!-- LLM box -->
  <rect x="320" y="75" width="60" height="60" rx="8" fill="#0a1929" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="350" y="108" text-anchor="middle" fill="#06b6d4" font-size="9" font-family="monospace">LLM</text>
  <!-- Labels -->
  <text x="200" y="200" text-anchor="middle" fill="white" font-size="14" font-family="monospace" font-weight="bold">RAG Assistant</text>
  <text x="200" y="218" text-anchor="middle" fill="#6366f1" font-size="9" font-family="monospace">Document Intelligence</text>
  <!-- Chunk labels -->
  <text x="80" y="200" text-anchor="middle" fill="#a5b4fc" font-size="8" font-family="monospace">Chunk</text>
  <text x="230" y="155" text-anchor="middle" fill="#a855f7" font-size="8" font-family="monospace">Embed &amp; Store</text>
  <text x="350" y="150" text-anchor="middle" fill="#06b6d4" font-size="8" font-family="monospace">Generate</text>
</svg>
