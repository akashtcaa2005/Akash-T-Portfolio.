<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b080c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Network nodes -->
  <circle cx="200" cy="100" r="20" fill="url(#accent)" opacity="0.9"/>
  <circle cx="100" cy="180" r="12" fill="#7c3aed" opacity="0.7"/>
  <circle cx="140" cy="220" r="12" fill="#06b6d4" opacity="0.7"/>
  <circle cx="260" cy="180" r="12" fill="#7c3aed" opacity="0.7"/>
  <circle cx="300" cy="60" r="12" fill="#06b6d4" opacity="0.7"/>
  <circle cx="80" cy="80" r="10" fill="#a855f7" opacity="0.6"/>
  <!-- Edges -->
  <line x1="200" y1="100" x2="100" y2="180" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="100" x2="140" y2="220" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="100" x2="260" y2="180" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="100" x2="300" y2="60" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="100" x2="80" y2="80" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
  <!-- Labels -->
  <text x="200" y="240" text-anchor="middle" fill="white" font-size="16" font-family="monospace" font-weight="bold">PredictX</text>
  <text x="200" y="260" text-anchor="middle" fill="#a855f7" font-size="10" font-family="monospace">Multi-Agent Financial AI</text>
  <text x="100" y="172" text-anchor="middle" fill="#06b6d4" font-size="7" font-family="monospace">Research</text>
  <text x="140" y="212" text-anchor="middle" fill="#06b6d4" font-size="7" font-family="monospace">Risk</text>
  <text x="260" y="172" text-anchor="middle" fill="#06b6d4" font-size="7" font-family="monospace">Quant</text>
  <text x="300" y="52" text-anchor="middle" fill="#06b6d4" font-size="7" font-family="monospace">Critic</text>
  <text x="80" y="72" text-anchor="middle" fill="#06b6d4" font-size="7" font-family="monospace">Memory</text>
</svg>
