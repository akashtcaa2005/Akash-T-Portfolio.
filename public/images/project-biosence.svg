<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b080c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#051a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Heartbeat line -->
  <polyline points="20,150 60,150 80,80 100,180 120,100 140,160 160,150 400,150"
    fill="none" stroke="#06d6a0" stroke-width="2" opacity="0.8"/>
  <!-- Pulse dot -->
  <circle cx="160" cy="150" r="5" fill="#06d6a0"/>
  <!-- Metrics boxes -->
  <rect x="20" y="20" width="80" height="40" rx="4" fill="#0a2a2a" stroke="#06b6d4" stroke-width="1" opacity="0.8"/>
  <text x="60" y="37" text-anchor="middle" fill="#06d6a0" font-size="11" font-family="monospace">HR</text>
  <text x="60" y="52" text-anchor="middle" fill="white" font-size="11" font-family="monospace">72 bpm</text>
  <rect x="120" y="20" width="80" height="40" rx="4" fill="#0a2a2a" stroke="#06b6d4" stroke-width="1" opacity="0.8"/>
  <text x="160" y="37" text-anchor="middle" fill="#06d6a0" font-size="11" font-family="monospace">SpO₂</text>
  <text x="160" y="52" text-anchor="middle" fill="white" font-size="11" font-family="monospace">98%</text>
  <rect x="220" y="20" width="80" height="40" rx="4" fill="#0a2a2a" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
  <text x="260" y="37" text-anchor="middle" fill="#a855f7" font-size="11" font-family="monospace">HRV</text>
  <text x="260" y="52" text-anchor="middle" fill="white" font-size="11" font-family="monospace">42 ms</text>
  <!-- Anomaly alert -->
  <rect x="300" y="120" width="80" height="30" rx="4" fill="#2d0a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="340" y="140" text-anchor="middle" fill="#ef4444" font-size="10" font-family="monospace">⚠ Anomaly</text>
  <!-- Labels -->
  <text x="200" y="250" text-anchor="middle" fill="white" font-size="16" font-family="monospace" font-weight="bold">BioSence</text>
  <text x="200" y="270" text-anchor="middle" fill="#06b6d4" font-size="10" font-family="monospace">Health Intelligence Platform</text>
</svg>
