  <circle cx="220" cy="100" r="6" fill="#a855f7" opacity="0.8"/>
  <circle cx="180" cy="70" r="6" fill="#a855f7" opacity="0.8"/>
  <circle cx="210" cy="115" r="6" fill="#a855f7" opacity="0.8"/>
